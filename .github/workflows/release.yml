name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --locked --all-extras
      - name: Check
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest
          nix flake check -L
      - name: Build distributions and Nix package
        run: |
          uv build
          nix build .#ai-tools-api
          sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*
            SHA256SUMS

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release-files
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/dist/* release-files/SHA256SUMS --generate-notes
