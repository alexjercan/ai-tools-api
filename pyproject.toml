[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools-api"
version = "0.2.1"
description = "A private bounded HTTP API for local AI tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<2", "pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
ai-tools-api = "ai_tools_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "UP006", "UP007", "UP035", "ASYNC109"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
